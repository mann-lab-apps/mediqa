name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure runtime config
        env:
          MEDIQA_APPS_SCRIPT_URL: ${{ secrets.MEDIQA_APPS_SCRIPT_URL }}
          MEDIQA_GA_MEASUREMENT_ID: ${{ secrets.MEDIQA_GA_MEASUREMENT_ID }}
        run: |
          node -e 'const fs = require("fs"); const config = { appsScriptUrl: process.env.MEDIQA_APPS_SCRIPT_URL || "", gaMeasurementId: process.env.MEDIQA_GA_MEASUREMENT_ID || "" }; fs.writeFileSync("public/config.js", "window.MEDIQA_CONFIG = " + JSON.stringify(config, null, 2) + ";\n");'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
