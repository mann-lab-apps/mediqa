name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure Apps Script endpoint
        env:
          MEDIQA_APPS_SCRIPT_URL: ${{ secrets.MEDIQA_APPS_SCRIPT_URL }}
        run: |
          node -e 'const fs = require("fs"); const url = process.env.MEDIQA_APPS_SCRIPT_URL || ""; fs.writeFileSync("public/config.js", "window.MEDIQA_CONFIG = {\n  appsScriptUrl: " + JSON.stringify(url) + "\n};\n");'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
